version: "3.8"

services:
  forum:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=meow-forum-docker-secret-key-change-in-production-1234567890
      - JWT_EXPIRY_HOURS=72
      - FRONTEND_URL=http://localhost:8080
      - OAUTH_PENDING_SECRET=meow-oauth-pending-secret-docker-key-1234567890
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URL=http://localhost:8080/api/auth/github/callback
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=http://localhost:8080/api/auth/google/callback
      - COOKIE_SECURE=false
    restart: unless-stopped
