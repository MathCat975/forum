<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum | Post</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/post.css">
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/index" aria-current="page">Forums</a>
        </nav>

        <div class="protocol-search">
            <a href="/search" class="search-link-btn">Search</a>
        </div>

        <nav class="protocol-actions" aria-label="Account">
            <a class="operator-badge" href="/profile" aria-label="Profile">ID</a>
        </nav>
    </header>

    <main class="protocol-shell post-shell">
        <aside class="directory-panel" aria-label="Directory">
            <div class="directory-head">
                <span class="terminal-icon" aria-hidden="true">></span>
                <div>
                    <strong>Directory</strong>
                    <small>Protocol v4.2.0</small>
                </div>
            </div>

            <nav class="directory-nav" aria-label="Forum navigation">
                <a href="/index"><span>::</span>Main Feed</a>
            </nav>

            <a class="init-thread" href="/create-post">Create post</a>

            <nav class="directory-footer" aria-label="Account links">
                <a href="/profile"><span>+</span>Profile</a>
                <a href="/admin" class="admin-link" id="admin-link" hidden><span>!</span>Admin</a>
            </nav>
        </aside>

        <section class="operations post-operations" aria-label="Post thread">
            <div class="thread-wrap">
                <section class="thread-header" aria-label="Thread title">
                    <h1>Loading...</h1>
                    <div class="thread-stats" aria-label="Thread statistics">
                        <span></span>
                    </div>
                </section>

                <article
                    class="thread-card thread-card--primary"
                    data-reply-author=""
                    data-reply-label="Original post"
                    data-reply-message=""
                >
                    <aside class="thread-author" aria-label="Original author">
                        <div class="avatar-frame avatar-frame--blue">
                            <div class="avatar-core" aria-hidden="true"></div>
                        </div>
                        <strong></strong>
                    </aside>

                    <div class="thread-copy">
                        <p></p>
                        <div class="thread-actions" aria-label="Post actions">
                            <button type="button" class="vote-btn vote-like" data-vote="1">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
                                <span class="vote-count" id="like-count">0</span>
                            </button>
                            <button type="button" class="vote-btn vote-dislike" data-vote="-1">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/></svg>
                                <span class="vote-count" id="dislike-count">0</span>
                            </button>
                            <button type="button" class="thread-reply-trigger">Reply</button>
                            <button type="button" class="admin-delete-post" id="admin-delete-post" hidden>Delete post</button>
                        </div>
                    </div>
                </article>

                <template id="reply-template">
                    <article class="thread-card thread-card--reply">
                        <aside class="thread-author thread-author--compact" aria-label="Reply author">
                            <div class="avatar-frame avatar-frame--ghost">
                                <div class="avatar-core avatar-core--ghost" aria-hidden="true"></div>
                            </div>
                            <strong></strong>
                        </aside>

                        <div class="thread-copy">
                            <p class="reply-quote"></p>
                            <p></p>
                            <div class="reply-meta">
                                <span></span>
                                <span></span>
                            </div>
                            <div class="thread-actions" aria-label="Reply actions">
                                <button type="button" class="thread-reply-trigger">Reply</button>
                                <button type="button" class="admin-delete-comment" hidden>Delete</button>
                            </div>
                        </div>
                    </article>
                </template>

                <form id="reply-form" class="composer-panel" aria-labelledby="create-post-title">
                    <div class="composer-head">
                        <h2 id="create-post-title">Reply</h2>
                    </div>

                    <div id="reply-indicator" class="reply-indicator" hidden>
                        <div class="reply-indicator__copy">
                            <span class="reply-indicator__eyebrow">Replying to</span>
                            <strong id="reply-target-meta"></strong>
                            <p id="reply-target-message"></p>
                        </div>
                        <button type="button" id="clear-reply-target" class="reply-indicator__clear">Clear</button>
                    </div>

                    <label class="sr-only" for="reply-box">Write your reply</label>
                    <div class="composer-toolbar" aria-label="Formatting tools">
                        <button type="button" class="composer-tool" data-action="bold" aria-label="Bold"><strong>B</strong></button>
                        <button type="button" class="composer-tool" data-action="italic" aria-label="Italic"><em>I</em></button>
                        <button type="button" class="composer-tool" data-action="heading1" aria-label="Heading 1">H1</button>
                        <button type="button" class="composer-tool" data-action="heading2" aria-label="Heading 2">H2</button>
                        <button type="button" class="composer-tool" data-action="quote" aria-label="Quote">"</button>
                        <button type="button" class="composer-tool" data-action="list" aria-label="List">#-</button>
                    </div>
                    <div class="composer-editor-shell">
                        <div
                            id="reply-preview"
                            class="composer-preview"
                            aria-hidden="true"
                            data-placeholder="Type your reply here..."
                        ></div>
                        <textarea
                            id="reply-box"
                            class="composer-input"
                            name="reply"
                            rows="7"
                            placeholder="Type your reply here..."
                            spellcheck="true"
                        ></textarea>
                    </div>

                    <div class="composer-actions">
                        <div class="composer-buttons">
                            <button type="submit" class="composer-button composer-button--primary">Post reply</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="protocol-footer">
        <strong>meow</strong>
        <span class="footer-love">Made with &#9829; by Meow</span>
    </footer>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/postComposer.js"></script>
    <script src="../assets/js/threadView.js"></script>
</body>
</html>
