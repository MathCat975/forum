<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOW | Complete Signup</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/index">Forums</a>
        </nav>

        <div class="protocol-search">
            <a href="/search" class="search-link-btn">Search</a>
        </div>

        <nav class="protocol-actions" aria-label="Account">
            <a class="operator-badge" href="/profile" aria-label="Profile">ID</a>
        </nav>
    </header>

    <main class="auth">
        <section class="auth-card" aria-label="Complete signup">
            <header class="auth-head">
                <p class="auth-kicker">Almost there</p>
                <h1 class="auth-title">Choose a username</h1>
                <p class="auth-sub">Pick a username to complete your account setup.</p>
            </header>

            <div class="auth-body">
                <p id="authMessage" class="auth-message" role="alert" hidden></p>

                <form id="complete-signup-form" class="auth-form">
                    <div class="field">
                        <label class="sr-only" for="username">Username</label>
                        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required autofocus>
                    </div>

                    <div class="auth-actions">
                        <button class="btn btn--primary" type="submit">Create account</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script>
      const form = document.getElementById("complete-signup-form");
      const msg = document.getElementById("authMessage");

      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        if (!username) return;

        try {
          const resp = await fetch("/api/auth/oauth/complete", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username }),
          });
          const data = await resp.json().catch(() => null);
          if (resp.ok) {
            window.location.href = "/index";
          } else {
            if (msg) {
              msg.textContent = data?.error || "Failed to complete signup.";
              msg.hidden = false;
            }
          }
        } catch {
          if (msg) {
            msg.textContent = "Network error. Try again.";
            msg.hidden = false;
          }
        }
      });
    </script>
</body>
</html>
