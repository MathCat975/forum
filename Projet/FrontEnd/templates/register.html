<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/chrome.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
    <script src="/assets/js/register.js" defer></script>
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/front/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/front/index">Forums</a>
            <a href="/front/register">Upgrades</a>
            <a href="#wiki">Wiki</a>
        </nav>

        <form class="protocol-search" role="search">
            <label class="sr-only" for="global-search">Search for posts</label>
            <input id="global-search" name="q" type="search" placeholder="Search for posts" autocomplete="off">
        </form>

        <nav class="protocol-actions" aria-label="Account">
            <a href="/front/login" aria-label="Notifications">
                <img src="/assets/img/header/notif.png" alt="">
            </a>
            <a href="/front/login" aria-label="Messages">
                <img src="/assets/img/header/message.png" alt="">
            </a>
            <a class="operator-badge" href="/front/profile" aria-label="Login">ID</a>
        </nav>
    </header>

    <main class="auth">
        <section class="auth-card" aria-label="Register">
            <header class="auth-head">
                <p class="auth-kicker">Let&apos;s get you started</p>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-sub">Join the conversation in a few quick steps.</p>
            </header>

            <div class="auth-body">
                <p id="authMessage" class="auth-message" role="alert" hidden></p>

                <form id="register-form" class="auth-form">
                    <div class="field">
                        <label class="sr-only" for="username">Username</label>
                        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label class="sr-only" for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label class="sr-only" for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
                    </div>

                    <div class="auth-actions">
                        <button class="btn btn--primary" type="submit">Create account</button>
                    </div>
                </form>

                <p class="social-copy">Or continue with</p>

                <div class="social-actions" aria-label="Social register options">
                    <button class="btn btn--social btn--google" type="button" aria-label="Register with Google" title="Register with Google">
                        <span class="social-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img" focusable="false">
                                <path fill="#4285F4" d="M21.81 10.04H12v3.92h5.63c-.25 1.3-.99 2.41-2.11 3.16l3.41 2.64c1.99-1.84 3.14-4.55 3.14-7.76 0-.66-.06-1.31-.17-1.96z"/>
                                <path fill="#34A853" d="M12 22c2.84 0 5.22-.94 6.96-2.54l-3.41-2.64c-.95.64-2.17 1.02-3.55 1.02-2.73 0-5.04-1.84-5.86-4.3H2.62v2.72A10.5 10.5 0 0 0 12 22z"/>
                                <path fill="#FBBC05" d="M6.14 13.54A6.32 6.32 0 0 1 5.81 12c0-.54.09-1.06.25-1.54V7.74H2.62A10.5 10.5 0 0 0 1.5 12c0 1.69.4 3.29 1.12 4.74z"/>
                                <path fill="#EA4335" d="M12 6.16c1.54 0 2.92.53 4.01 1.57l3-3C17.21 3.07 14.83 2 12 2 7.89 2 4.33 4.36 2.62 7.74l3.44 2.72c.82-2.46 3.13-4.3 5.94-4.3z"/>
                            </svg>
                        </span>
                        <span>Continue with Google</span>
                    </button>
                    <button class="btn btn--social btn--github" type="button" aria-label="Register with GitHub" title="Register with GitHub">
                        <span class="social-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img" focusable="false">
                                <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.11.79-.25.79-.56v-2.17c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.71.08-.69.08-.69 1.16.08 1.77 1.19 1.77 1.19 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.72-1.55-2.55-.29-5.23-1.28-5.23-5.67 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.14 1.17A10.9 10.9 0 0 1 12 6.33c.97 0 1.95.13 2.86.38 2.18-1.48 3.14-1.17 3.14-1.17.62 1.59.23 2.76.11 3.05.73.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.37-5.25 5.66.41.35.78 1.04.78 2.1v3.12c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                            </svg>
                        </span>
                        <span>Continue with GitHub</span>
                    </button>
                </div>

                <p class="auth-foot">
                    Already have an account?
                    <a class="auth-link" href="/front/login">Connect</a>
                </p>
            </div>
        </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
