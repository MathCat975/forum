<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOW | Search</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/search.css">
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/index">Forums</a>
        </nav>

        <div class="protocol-search">
            <a href="/search" class="search-link-btn" style="border-color:rgba(61,108,224,0.5);color:#fff;">Search</a>
        </div>

        <nav class="protocol-actions" aria-label="Account">
            <a class="operator-badge" href="/profile" aria-label="Profile">ID</a>
        </nav>
    </header>

    <main class="protocol-shell">
        <aside class="directory-panel" aria-label="Directory">
            <div class="directory-head">
                <span class="terminal-icon" aria-hidden="true">></span>
                <div>
                    <strong>Directory</strong>
                    <small>Protocol v4.2.0</small>
                </div>
            </div>

            <nav class="directory-nav" aria-label="Forum navigation">
                <a href="/index"><span>::</span>Main Feed</a>
            </nav>

            <a class="init-thread" href="/create-post">Create post</a>

            <nav class="directory-footer" aria-label="Support links">
                <a href="/profile"><span>+</span>Profile</a>
                <a href="/admin" id="admin-link" hidden><span>!</span>Admin</a>
            </nav>
        </aside>

        <section class="operations" aria-label="Search">
            <section class="hero-panel">
                <div>
                    <span class="eyebrow">Search Protocol</span>
                    <h1>Search</h1>
                    <p>Locate threads, operators, and nodes across the network.</p>
                </div>
            </section>

            <div class="search-form-wrap">
                <div class="search-row">
                    <input id="searchInput" type="text" class="search-main-input" placeholder="Search titles, messages, comments..." autofocus>
                    <button id="searchButton" class="init-thread" type="button" style="margin:0;min-height:40px;">Search</button>
                </div>

                <div class="search-filters">
                    <select id="scopeFilter">
                        <option value="all">All</option>
                        <option value="titles">Titles</option>
                        <option value="comments">Comments</option>
                    </select>
                    <input id="usernameFilter" type="text" placeholder="Username">
                    <input id="categoryFilter" type="number" min="1" placeholder="Category ID">
                    <input id="fromFilter" type="date">
                    <input id="toFilter" type="date">
                    <select id="sizeFilter">
                        <option value="20">20</option>
                        <option value="10">10</option>
                        <option value="50">50</option>
                    </select>
                </div>

                <p id="searchMessage" class="search-msg"></p>
            </div>

            <div class="search-results-head">
                <span id="resultsCount" class="results-count-label">0 results</span>
            </div>

            <div id="resultsList" class="search-results"></div>

            <div class="search-pagination">
                <button id="prevPageButton" type="button" disabled>Previous</button>
                <span id="pageIndicator">Page 1</span>
                <button id="nextPageButton" type="button" disabled>Next</button>
            </div>
        </section>
    </main>

    <footer class="protocol-footer">
        <strong>meow</strong>
        <span class="footer-love">Made with &#9829; by Meow</span>
    </footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/search.js"></script>
</body>
</html>
