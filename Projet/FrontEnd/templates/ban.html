<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban</title>
    <link rel="stylesheet" href="/assets/css/ban.css">
    <link rel="stylesheet" href="/assets/css/header.css">
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/front/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/front/index">Forums</a>
            <a href="/front/register">Upgrades</a>
            <a href="#wiki">Wiki</a>
        </nav>

        <form class="protocol-search" role="search">
            <label class="sr-only" for="global-search">Search for posts</label>
            <input id="global-search" name="q" type="search" placeholder="Search for posts" autocomplete="off">
        </form>

        <nav class="protocol-actions" aria-label="Account">
            <a href="/assets/templateslogin" aria-label="Notifications">
                <img src="/assets/img/header/notif.png" alt="">
            </a>
            <a href="/assets/templateslogin.html" aria-label="Messages">
                <img src="/assets/img/header/message.png" alt="">
            </a>
            <a class="operator-badge" href="/front/profile" aria-label="Login">ID</a>
        </nav>
    </header>

    <main>
        <div id="banContainer">
            <h1>
                You have been banned
            </h1>
            <div id="banRules">
                <p>Your account has been banned for breaching one of the following rules:</p>
                
                <ul>
                    <li>
                        obscene content
                    </li>
                    <li>
                        illegal content
                    </li>
                    <li>
                        offensive content
                    </li>
                </ul>

            </div>
        </div>
    </main>

     <footer class="protocol-footer">
        <strong>meow</strong>
        <nav aria-label="Footer">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">API</a>
            <a href="#">Donations</a>
        </nav>
    </footer>
</body>
</html>
