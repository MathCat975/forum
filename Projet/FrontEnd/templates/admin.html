<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOW | Admin</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
    <header class="protocol-topbar" aria-label="Site header">
        <a class="protocol-brand" href="/index" aria-label="Forum home">
            <span class="brand-node" aria-hidden="true">></span>
            <span>meow</span>
        </a>

        <nav class="protocol-tabs" aria-label="Sections">
            <a href="/index">Forums</a>
        </nav>

        <div class="protocol-search">
            <a href="/search" class="search-link-btn">Search</a>
        </div>

        <nav class="protocol-actions" aria-label="Account">
            <a class="operator-badge" href="/profile" aria-label="Profile">ID</a>
        </nav>
    </header>

    <main class="protocol-shell">
        <aside class="directory-panel" aria-label="Directory">
            <div class="directory-head">
                <span class="terminal-icon" aria-hidden="true">></span>
                <div>
                    <strong>Directory</strong>
                    <small>Admin Panel</small>
                </div>
            </div>

            <nav class="directory-nav" aria-label="Forum navigation">
                <a href="/index"><span>::</span>Main Feed</a>
                <a href="/admin" class="is-active"><span>!</span>Admin</a>
            </nav>

            <nav class="directory-footer" aria-label="Account links">
                <a href="/profile"><span>+</span>Profile</a>
            </nav>
        </aside>

        <section class="operations" aria-label="Admin panel">
            <section class="hero-panel">
                <div>
                    <span class="eyebrow">Administration</span>
                    <h1>Users</h1>
                    <p>Manage users, roles and permissions.</p>
                </div>
            </section>

            <div id="admin-error" class="admin-error" hidden></div>
            <div id="admin-loading" class="loading-state">Loading users...</div>

            <section id="admin-panel" hidden>
                <div class="admin-stats" id="admin-stats"></div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <footer class="protocol-footer">
        <strong>meow</strong>
        <span class="footer-love">Made with &#9829; by Meow</span>
    </footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/admin.js"></script>
</body>
</html>
