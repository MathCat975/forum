<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/chrome.css">
    <link rel="stylesheet" href="../assets/css/profile.css">
</head>

<body>
    <site-header title="Forum" subtitle="Account status"></site-header>

    <main>
        <div id="profileHead">
            <img src="../assets/img/profile/banner.jpg" alt="Banner">
            <span id="profilePhotoName">
                <img src="../assets/img/profile/photo.jpg" alt="Profile Photo">
                <div id="photoName">
                    <h4 id="pseudo">Username</h4>
                    <p id="description">Member since 2019</p>
                </div>
            </span>
        </div>

        <div id="profileContent">
            <div id="profileSidebar">
                <div class="profile-card">
                    <h3>Social</h3>
                    <div class="stat-item">
                        <span class="stat-label">Friends</span>
                        <span class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Likes</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Information</h3>
                    <div class="stat-item">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" style="color: #00ff00;">Online</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Registration</span>
                        <span class="stat-value">26 April, 2026</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Last Visit</span>
                        <span class="stat-value">Now</span>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div id="profileMain">

                <div class="section-card">
                    <div class="section-header">Stats</div>
                    <div class="section-content section-content-stats">
                        <div class="section-content-column">
                            <div class="section-content-row">
                                <div class="section-content-content">
                                    <span id="number-posts" class="stat-label">0</span>
                                    <p class="stat-label"> posts published</p>
                                </div>

                                <div class="section-content-content">
                                    <span id="number-likes" class="stat-label">0</span>
                                    <p class="stat-label"> posts like</p>
                                </div>
                            </div>
                        </div>

                        <div class="section-content-column">
                            <div class="section-content-row">
                                <div class="section-content-content">
                                    <span id="number-posts" class="stat-label">0</span>
                                    <p class="stat-label"> posts published</p>
                                </div>

                                <div class="section-content-content">
                                    <span id="number-likes" class="stat-label">0</span>
                                    <p class="stat-label"> posts like</p>
                                </div>
                            </div>
                        </div>

                        <div class="section-content-column">
                            <div class="section-content-row">
                                <div class="section-content-content">
                                    <span id="number-posts" class="stat-label">0</span>
                                    <p class="stat-label"> posts published</p>
                                </div>

                                <div class="section-content-content">
                                    <span id="number-likes" class="stat-label">0</span>
                                    <p class="stat-label"> posts like</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-header">Groups</div>
                    <div class="section-content">
                        Not a member of a group
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-header">Followers</div>
                    <div class="section-content">
                        <p>No followers</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <site-footer title="Forum"></site-footer>
    <script src="../assets/js/chrome.js" defer></script>
</body>

</html>
